name: Desktop builds

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      full_ai_validation:
        description: Download all five AI models and run full native inference tests
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate packaging configuration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Test packaging helpers
        run: python -m unittest discover -s scripts/tests -v
      - name: Check release tag and application versions
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check-release-version.py "$RELEASE_TAG"

  build:
    needs: validate
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            artifact: PhotoSys-windows-x64
            paths: src-tauri/target/release/bundle/nsis/*.exe
          - runner: ubuntu-24.04
            artifact: PhotoSys-linux-x64
            paths: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          - runner: macos-15
            artifact: PhotoSys-macos-universal
            tauri_args: --target universal-apple-darwin
            paths: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Prepare app-local Windows C++ runtime
        if: runner.os == 'Windows'
        run: python scripts/prepare-windows-runtime.py

      - name: Prepare bundled AI CPU runtime
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            python scripts/prepare-ai-runtime.py --universal
          else
            python scripts/prepare-ai-runtime.py
          fi
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python scripts/check-ai-runtime.py src-tauri/binaries/onnxruntime --dll-directory src-tauri/target/windows-runtime/x64
          else
            python scripts/check-ai-runtime.py src-tauri/binaries/onnxruntime
          fi

      - name: Prepare bundled offline map tool
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            python scripts/prepare-offline-maps.py --universal
          else
            python scripts/prepare-offline-maps.py
          fi

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          # The Azure mirror can stall DNS lookups on hosted runners.
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i 's|https\?://azure\.archive\.ubuntu\.com/ubuntu|https://mirror.math.princeton.edu/pub/ubuntu|' /etc/apt/apt-mirrors.txt
          fi
          apt_options=(-o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_options[@]}" update -o APT::Update::Error-Mode=any
          sudo apt-get "${apt_options[@]}" install -y build-essential ca-certificates curl wget file pkg-config \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good nasm patchelf xdg-utils

      - name: Set up Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install macOS Rust targets
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          brew install pkgconf nasm

      - name: Prepare Windows codec toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: curl diffutils make perl mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-nasm mingw-w64-ucrt-x86_64-pkgconf

      - name: Build bundled FFmpeg on Linux
        if: runner.os == 'Linux'
        run: bash scripts/build-media-codec.sh

      - name: Build bundled FFmpeg on macOS
        if: runner.os == 'macOS'
        run: bash scripts/build-media-codec.sh universal-apple-darwin

      - name: Build bundled FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash scripts/build-media-codec.sh

      - run: npm ci

      - name: Run Rust tests
        env:
          # Avoid macOS /var aliases in SQLite NOFOLLOW tests.
          TMPDIR: ${{ runner.temp }}
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Verify native local face inference and offline installation
        if: github.event_name == 'workflow_dispatch' && inputs.full_ai_validation
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          python scripts/prepare-people-test.py "$RUNNER_TEMP/photosys-people-test"
          export PHOTOSYS_PEOPLE_MODEL_DIR="$RUNNER_TEMP/photosys-people-test"
          export PHOTOSYS_PEOPLE_PACKAGE="$RUNNER_TEMP/photosys-people-test/photosys-people.zip"
          cargo test --locked --manifest-path src-tauri/Cargo.toml real_faces_install_incremental_cancel_and_restore -- --ignored --nocapture

      - name: Verify all five native model options and offline imports
        if: github.event_name == 'workflow_dispatch' && inputs.full_ai_validation
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          python scripts/prepare-model-options-test.py "$RUNNER_TEMP/photosys-model-options"
          export PHOTOSYS_MODEL_OPTIONS_DIR="$RUNNER_TEMP/photosys-model-options"
          export PHOTOSYS_MODEL_OPTIONS_PORTRAIT="$RUNNER_TEMP/photosys-people-test/lena.jpg"
          export PHOTOSYS_MODEL_OPTIONS_METRICS="$RUNNER_TEMP/model-options-metrics.json"
          cargo test --locked --manifest-path src-tauri/Cargo.toml real_model_options_install_infer_and_reference -- --ignored --nocapture --test-threads=1
          cargo test --locked --manifest-path src-tauri/Cargo.toml real_search_model_selection_manual_gate_cancel_resume_and_switch_back -- --ignored --nocapture --test-threads=1
          cargo test --locked --manifest-path src-tauri/Cargo.toml real_people_model_selection_keeps_manual_identity_and_requires_manual_start -- --ignored --nocapture --test-threads=1

      - name: Build desktop packages
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm run tauri build -- ${{ matrix.tauri_args }} -- --locked

      - name: Verify FFmpeg in Linux packages
        if: runner.os == 'Linux'
        run: |
          bundle="$PWD/src-tauri/target/release/bundle"
          scratch="$(mktemp -d)"
          cd "$scratch"
          dpkg-deb -x "$bundle"/deb/*.deb deb
          deb/usr/bin/photosys-ffmpeg -version
          "$bundle"/appimage/*.AppImage --appimage-extract >/dev/null
          squashfs-root/usr/bin/photosys-ffmpeg -version
          test -f squashfs-root/usr/lib/gstreamer-1.0/libgstvpx.so
          python "$GITHUB_WORKSPACE/scripts/check-ai-runtime.py" deb
          python "$GITHUB_WORKSPACE/scripts/check-ai-runtime.py" squashfs-root

      - name: Verify universal macOS executable
        if: runner.os == 'macOS'
        run: |
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/PhotoSys.app"
          executable=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Contents/Info.plist")
          lipo "$app/Contents/MacOS/$executable" -verify_arch arm64 x86_64
          lipo "$app/Contents/MacOS/photosys-ffmpeg" -verify_arch arm64 x86_64
          "$app/Contents/MacOS/photosys-ffmpeg" -version
          lipo "$app/Contents/Resources/onnxruntime/aarch64/libonnxruntime.dylib" -verify_arch arm64
          lipo "$app/Contents/Resources/onnxruntime/x86_64/libonnxruntime.dylib" -verify_arch x86_64
          python scripts/check-ai-runtime.py "$app/Contents/Resources/onnxruntime"

      - name: Verify bundled Windows installer dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $installer) { throw "PhotoSys installer is missing" }
          $unpacked = Join-Path $env:RUNNER_TEMP photosys-installer
          & "$env:ProgramFiles/7-Zip/7z.exe" x $installer.FullName "-o$unpacked" -y
          if ($LASTEXITCODE -ne 0) { throw "Could not extract the PhotoSys installer" }
          foreach ($name in @('photosys.exe', 'photosys-ffmpeg.exe', 'photosys-pmtiles.exe',
                              'msvcp140.dll', 'msvcp140_1.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            $file = Get-Item -LiteralPath (Join-Path $unpacked $name) -ErrorAction SilentlyContinue
            if (-not $file -or $file.PSIsContainer -or $file.Length -eq 0) {
              throw "Missing or empty file next to the installed application: $name"
            }
          }
          & (Join-Path $unpacked 'photosys-ffmpeg.exe') -version
          if ($LASTEXITCODE -ne 0) { throw "Bundled FFmpeg failed to start" }
          & (Join-Path $unpacked 'photosys-pmtiles.exe') version
          if ($LASTEXITCODE -ne 0) { throw "Bundled PMTiles failed to start" }
          python scripts/check-ai-runtime.py $unpacked --dll-directory $unpacked
          if ($LASTEXITCODE -ne 0) { throw "Bundled AI runtime failed to load" }

      - name: Check expected packages
        shell: pwsh
        env:
          PACKAGE_PATHS: ${{ matrix.paths }}
        run: |
          foreach ($pattern in ($env:PACKAGE_PATHS.Trim() -split '\r?\n')) {
            $packages = Get-ChildItem -Path $pattern -File -ErrorAction SilentlyContinue
            if (-not ($packages | Where-Object { $_.Length -gt 0 })) {
              throw "Missing or empty package matching $pattern"
            }
          }

      - name: Upload desktop packages
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.paths }}
            src-tauri/binaries/media-codec-sources.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Summarize desktop packages
        shell: bash
        env:
          ARTIFACT_NAME: ${{ matrix.artifact }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          PACKAGE_PATHS: ${{ matrix.paths }}
          FULL_AI_VALIDATION: ${{ github.event_name == 'workflow_dispatch' && inputs.full_ai_validation }}
        run: |
          {
            printf '### %s\n\n' "$ARTIFACT_NAME"
            printf '[Download artifact](%s) (retained for 30 days)\n\n' "$ARTIFACT_URL"
            printf 'Package patterns:\n```text\n%s\n```\n\n' "$PACKAGE_PATHS"
            printf 'Includes media-codec-sources.tar.gz. Full AI validation: %s.\n' "$FULL_AI_VALIDATION"
          } >> "$GITHUB_STEP_SUMMARY"

  macos-intel-runtime:
    needs: validate
    name: AI runtime on Intel macOS
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python scripts/prepare-ai-runtime.py
      - run: python scripts/check-ai-runtime.py src-tauri/binaries/onnxruntime

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [validate, build, macos-intel-runtime]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: desktop-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          pattern: PhotoSys-*
          path: release-artifacts
      - name: Upload verified assets and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/publish-desktop-release.py "$RELEASE_TAG" release-artifacts release-assets
